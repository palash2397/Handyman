name: Handyman CI/CD

on:
  push:
    branches: ['main', 'develop']

jobs:
  # -------------------------------------------------------------
  #  Check Backend (Lint & TypeScript compilation check on GitHub)
  # -------------------------------------------------------------
  check-backend:
    name: Check Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit

      - name: Verify build compilation
        run: npm run build

  # -------------------------------------------------------------
  #  Deploy to Development (Using Docker)
  # -------------------------------------------------------------
  deploy-dev:
    name: Deploy to Development
    needs: check-backend
    if: github.ref == 'refs/heads/develop'
    runs-on: [self-hosted]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file safely
        run: |
          rm -f .env
          printf "%s" "${{ secrets.DEV_ENV_FILE }}" > .env
          chmod 600 .env

      - name: Deploy with Docker Compose
        run: |
          docker compose up -d --build --remove-orphans

  # -------------------------------------------------------------
  #  Deploy to Production (Using Docker)
  # -------------------------------------------------------------
  deploy-prod:
    name: Deploy to Production
    needs: check-backend
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env file safely
        run: |
          rm -f .env
          printf "%s" "${{ secrets.PROD_ENV_FILE }}" > .env
          chmod 600 .env

      - name: Deploy with Docker Compose
        run: |
          docker compose up -d --build --remove-orphans
