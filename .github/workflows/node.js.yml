name: Handyman CI/CD

on:
  push:
    branches: ['main', 'develop']

jobs:
  # -------------------------------------------------------------
  #  Check Backend 
  # -------------------------------------------------------------
  check-backend:
    name: Check Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit

      - name: Verify build compilation
        run: npm run build

  # -------------------------------------------------------------
  #  Deploy to Development 
  # -------------------------------------------------------------
  deploy-dev:
    name: Deploy to Development
    needs: check-backend
    if: github.ref == 'refs/heads/develop'
    runs-on: [self-hosted] 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit

      - name: Create .env file safely
        run: |
          rm -f .env
          printf "%s" "${{ secrets.DEV_ENV_FILE }}" > .env
          chmod 600 .env

      - name: Add Node & PM2 to PATH
        run: |
          for p in /home/team_node/.local/share/fnm/current/bin /home/team_node/.local/share/fnm/node-versions/*/installation/bin /home/nodeteam/.local/share/fnm/node-versions/*/installation/bin; do
            if [ -d "$p" ]; then
              echo "$p" >> $GITHUB_PATH
            fi
          done

      - name: Build project
        run: npm run build

      - name: Run backend with PM2
        run: |
          pm2 reload handyman-dev --update-env || pm2 start dist/main.js --name handyman-dev --max-memory-restart 500M
          pm2 save

  # -------------------------------------------------------------
  #  Deploy to Production 
  # -------------------------------------------------------------
  deploy-prod:
    name: Deploy to Production
    needs: check-backend
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted] 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit

      - name: Create .env file safely
        run: |
          rm -f .env
          printf "%s" "${{ secrets.PROD_ENV_FILE }}" > .env
          chmod 600 .env

      - name: Add Node & PM2 to PATH
        run: |
          for p in /home/team_node/.local/share/fnm/current/bin /home/team_node/.local/share/fnm/node-versions/*/installation/bin /home/nodeteam/.local/share/fnm/node-versions/*/installation/bin; do
            if [ -d "$p" ]; then
              echo "$p" >> $GITHUB_PATH
            fi
          done

      - name: Build project
        run: npm run build

      - name: Run backend with PM2
        run: |
          if pm2 describe handyman-prod > /dev/null 2>&1; then
            echo "Existing process found. Reloading with zero downtime..."
            pm2 reload handyman-prod --update-env
          else
            echo "Starting fresh PM2 process..."
            pm2 start dist/main.js --name handyman-prod --max-memory-restart 500M
          fi
          pm2 save
